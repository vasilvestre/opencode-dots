# Turn one labeled GitHub issue into one pull request.
#
# Called by awf-gh on the `issue-labeled` event, for the issues that carry a
# label named in its config. The label is the trigger: an issue nobody labels
# is never touched. The branch and the pull request carry the issue, and the
# body says `Closes #N`, so merging the pull request closes the issue.
#
# This file is the router and the shared steps (fetch, push, notify). The agent
# step lives in two hidden workflows: _fix-issue-owned for a repository the token
# can write to, _fix-issue-external for any other, whose pull request goes
# through my fork and is read by maintainers who do not know me. Each has its
# own prompt and its own model (see model-presets.yaml).
name: fix-issue
version: "1.0.0"
inputs:
  - name: repo
    type: string
    required: true
  - name: issue
    type: string
    required: true
  - name: autonomy
    type: string
    required: false
    default: ""
    description: ceiling from the repository (observe, propose, act, auto); empty means no ceiling, ADR 0040
    validation:
      pattern: '^(observe|propose|act|auto)?$'
  - name: label
    type: string
    required: false
  - name: event
    type: string
    required: false

states:
  initial: fetch

  fetch:
    type: step
    command: |
      set -eu
      repo={{.inputs.repo}}
      iss={{.inputs.issue}}
      d=${STATE_DIR:-/state}/fix/$repo/issue-$iss
      mkdir -p "$(dirname "$d")"

      # One run at a time per issue. The fetch below recreates the checkout, so
      # a second run starting while the first is still working wiped the tree
      # the first run was about to read, and its push found nothing to send.
      # A lock held longer than a whole run is stale: take it over.
      lock="$d.lock"
      waited=0
      while [ -d "$lock" ]; do
        age=$(( $(date +%s) - $(stat -c %Y "$lock") ))
        if [ "$age" -gt 1200 ]; then
          echo "taking over a stale lock held for ${age}s"
          rm -rf "$lock"
          break
        fi
        if [ "$waited" -ge 600 ]; then
          echo "lock still held after ${waited}s, giving up on this run"
          exit 1
        fi
        sleep 5
        waited=$((waited + 5))
      done
      mkdir "$lock"

      # worklog.md is the memory of earlier runs on this issue, and the wipe
      # below recreates the directory: hold the file aside.
      keep=$(mktemp)
      [ -s "$d/worklog.md" ] && cp "$d/worklog.md" "$keep" || true
      rm -rf "$d"
      mkdir -p "$d"
      [ -s "$keep" ] && mv "$keep" "$d/worklog.md" || rm -f "$keep"
      gh issue view "$iss" --repo "$repo" \
        --json number,title,body,author,labels,state,comments > "$d/issue.json"
      echo "issue #$iss: $(jq -r .title "$d/issue.json")"

      branch=$(gh api "repos/$repo" --jq '.default_branch')
      echo "$branch" > "$d/default_branch"
      url="https://github.com/$repo.git"
      work_root=${WORK_ROOT:-${STATE_DIR:-/state}/work}
      mkdir -p "$work_root"
      src=$(awk -F= -v k="$repo" \
        '!/^[[:space:]]*#/ && $1==k { sub(/^[^=]*=/, ""); print; exit }' \
        "${REPOS_MAP:-/work/repos.map}" 2>/dev/null || true)
      if [ -n "$src" ] && [ -d "$src/.git" ]; then
        echo "reusing checkout $src"
      else
        src="$work_root/$repo"
        [ -d "$src/.git" ] || git clone --quiet --filter=blob:none --no-checkout "$url" "$src"
      fi
      gh auth setup-git
      git -C "$src" fetch --quiet "$url" "refs/heads/$branch"
      git -C "$src" worktree prune
      git -C "$src" worktree remove --force "$d/work" 2>/dev/null || true
      git -C "$src" worktree add --quiet --detach "$d/work" FETCH_HEAD
      git -C "$d/work" log --oneline -1

      # The lessons and memory a tend pass already wrote for this repository.
      tend=${STATE_DIR:-/state}/tend/$repo
      [ -f "$tend/lessons.md" ] && cp "$tend/lessons.md" "$d/lessons.md" || true
      [ -f "$tend/memory.md" ] && cp "$tend/memory.md" "$d/memory.md" || true
    timeout: 300
    on_success: classify_check
    on_failure: error

  # Classification (ADR 0040) runs only under an autonomy ceiling. With no
  # ceiling this step prints LEGACY and the run goes to route as before: no
  # model call, no file.
  classify_check:
    type: step
    command: |
      set -eu
      if [ -n "{{.inputs.autonomy}}" ]; then printf CLASSIFY; else printf LEGACY; fi
    timeout: 30
    transitions:
      - when: 'states.classify_check.Output contains "CLASSIFY"'
        goto: classify_text
    on_success: route
    on_failure: error

  # Drop any earlier result first, so a failed classification reads as missing
  # (level 3) and never as a stale lower level. Then print the item text: the
  # text reaches the hidden workflow as an input, never a shell command.
  classify_text:
    type: step
    command: |
      set -eu
      d=${STATE_DIR:-/state}/fix/{{.inputs.repo}}/issue-{{.inputs.issue}}
      rm -f "${STATE_DIR:-/state}/classify/{{.inputs.repo}}/issue-{{.inputs.issue}}.json" "$d/item_class"
      jq -r '"# \(.title)\n\n\(.body // "")\n\n" + ([.comments[]? | "--\n\(.body // "")"] | join("\n"))' \
        "$d/issue.json" | head -c 8000
    timeout: 60
    on_success: classify
    on_failure: level

  classify:
    type: call_workflow
    workflow: _classify-item
    inputs:
      repo: "{{.inputs.repo}}"
      key: "issue-{{.inputs.issue}}"
      text: "{{.states.classify_text.Output}}"
    timeout: 1000
    on_success: level
    on_failure: level

  # The level the publish gate reads. A missing, unreadable or out-of-range
  # result is level 3: with a ceiling set, an unclassified item fails closed.
  level:
    type: step
    command: |
      set -eu
      d=${STATE_DIR:-/state}/fix/{{.inputs.repo}}/issue-{{.inputs.issue}}
      f=${STATE_DIR:-/state}/classify/{{.inputs.repo}}/issue-{{.inputs.issue}}.json
      lvl=$(jq -r '.level | select(type == "number") | tostring' "$f" 2>/dev/null || true)
      case "$lvl" in 1|2|3) ;; *) echo "classification missing or invalid, treating as level 3"; lvl=3 ;; esac
      mkdir -p "$d"
      echo "$lvl" > "$d/item_class"
      echo "item class $lvl"
    timeout: 30
    on_success: route
    on_failure: error

  # The token decides, not a list of repositories: write access means the repo is
  # mine to push to, anything else is somebody's upstream.
  route:
    type: step
    command: |
      set -eu
      if [ "$(gh api "repos/{{.inputs.repo}}" --jq '.permissions.push // false' 2>/dev/null || echo false)" = true ]; then
        printf OWNED
      else
        printf EXTERNAL
      fi
    timeout: 60
    transitions:
      - when: 'states.route.Output contains "EXTERNAL"'
        goto: fix_external
    on_success: fix_owned
    on_failure: error

  fix_owned:
    type: call_workflow
    workflow: _fix-issue-owned
    inputs:
      repo: "{{.inputs.repo}}"
      issue: "{{.inputs.issue}}"
    timeout: 1700
    on_success: push
    on_failure: error

  fix_external:
    type: call_workflow
    workflow: _fix-issue-external
    inputs:
      repo: "{{.inputs.repo}}"
      issue: "{{.inputs.issue}}"
    timeout: 1700
    on_success: push
    on_failure: error

  push:
    type: step
    command: |
      set -eu
      repo={{.inputs.repo}}
      iss={{.inputs.issue}}
      d=${STATE_DIR:-/state}/fix/$repo/issue-$iss
      work="$d/work"
      # Say what was compared: a push step that finds nothing must be readable
      # after the fact, not a silent `completed`.
      head=$(git -C "$work" rev-parse --short HEAD)
      changed=$(git -C "$work" status --porcelain | wc -l)
      echo "push: work=$work head=$head changed=$changed" | tee "$d/push.log"

      if [ -z "$(git -C "$work" status --porcelain)" ]; then
        echo "no code change for issue #$iss" | tee -a "$d/push.log"
        exit 0
      fi
      if [ ! -s "$d/fix.md" ]; then
        # The agent left edits and no pull request text: it stopped halfway.
        # Dropping them and ending in success hid a failed run. Keep the
        # worktree for a look, release the lock and fail.
        echo "ABANDONED: $changed files changed in $work but no fix.md; worktree kept" | tee -a "$d/push.log" >&2
        if [ -s "$d/answer.md" ]; then
          # Autonomy ceiling (ADR 0040): bin/publish-gate decides, an empty input is legacy.
          grc=0
          if [ -n "{{.inputs.autonomy}}" ]; then
            ITEM_CLASS=$(cat "$d/item_class" 2>/dev/null || echo 3) \
            AUTONOMY="{{.inputs.autonomy}}" GATE_REF="$repo#$iss" GATE_ARTIFACT="$d/answer.md" GATE_REPO="$repo" \
              "${DOTS_HOME:-/work}/bin/publish-gate" comment || grc=$?
            [ "$grc" = 0 ] || echo "autonomy: answer not published (gate $grc)"
          fi
          if [ "$grc" = 0 ]; then
            gh issue comment "$iss" --repo "$repo" --body-file "$d/answer.md" \
              || echo "issue comment failed"
          fi
        fi
        rm -rf "$d.lock"
        exit 1
      fi
      title=$(head -1 "$d/fix.md")
      branch="fix/$iss-$(date -u +%Y%m%d-%H%M)"
      login=$(gh api user --jq .login)
      uid=$(gh api user --jq .id)
      git -C "$work" config user.name "$login"
      git -C "$work" config user.email "$uid+$login@users.noreply.github.com"
      git -C "$work" checkout --quiet -b "$branch"
      git -C "$work" add -A
      git -C "$work" commit --quiet -m "$title"
      # The agent step can run for 25 minutes, so the base read at fetch time is
      # already old when the branch is pushed. Rebase onto a fresh base now, or
      # the pull request opens with conflicts. A rebase that cannot apply is not
      # a reason to lose the work: push as is and let the log say so.
      base=$(cat "$d/default_branch")
      if git -C "$work" fetch --quiet "https://github.com/$repo.git" "refs/heads/$base"; then
        if git -C "$work" rebase --quiet FETCH_HEAD; then
          echo "rebased onto $base" | tee -a "$d/push.log"
        else
          git -C "$work" rebase --abort
          echo "rebase onto $base failed, pushing the commit as is" | tee -a "$d/push.log"
        fi
      fi

      # A human claim is a veto on this branch (ADR 0026). It is read before the
      # fork work, so a held branch creates nothing.
      if [ -x "${DOTS_HOME:-/work}/bin/held" ]; then
        "${DOTS_HOME:-/work}/bin/held" "$repo" "$branch" || rc=$?
        case ${rc:-0} in
          0) ;;
          3) echo "held: a human works on $branch, no push"
             printf 'A human holds a claim on %s: the change is not pushed.\n' "$branch" > "$d/held.md"
             exit 0 ;;
          *) echo "held: the claim check failed, pushing anyway" ;;
        esac
      fi

      # Autonomy ceiling (ADR 0040): bin/publish-gate decides, an empty input is legacy.
      if [ -n "{{.inputs.autonomy}}" ]; then
        grc=0
        git -C "$work" format-patch --stdout HEAD~1 > "$d/held.patch"
        ITEM_CLASS=$(cat "$d/item_class" 2>/dev/null || echo 3) \
        AUTONOMY="{{.inputs.autonomy}}" GATE_REF="$repo#$iss" GATE_ARTIFACT="$d/held.patch" GATE_REPO="$repo" \
        GATE_BRANCH="$branch" GATE_BASE="$base" GATE_TITLE="$title" \
          "${DOTS_HOME:-/work}/bin/publish-gate" push || grc=$?
        [ "$grc" = 0 ] || { echo "autonomy: change not pushed (gate $grc)"; exit 0; }
      fi

      # Where the branch goes. A repository I can write to takes it directly.
      # Any other one (an upstream I am not a maintainer of) gets the branch on
      # my fork: reuse the fork when it exists, create it when it does not. This
      # runs only now, with a commit in hand, so a run that changes nothing never
      # creates a fork.
      push_url="https://github.com/$repo.git"
      head_ref="$branch"
      can_push=$(gh api "repos/$repo" --jq '.permissions.push // false' 2>/dev/null || echo false)
      if [ "$can_push" != true ]; then
        fork="$login/${repo#*/}"
        parent=$(gh api "repos/$fork" \
          --jq 'if .fork then .parent.full_name else "not-a-fork" end' 2>/dev/null || echo missing)
        case "$parent" in
          "$repo")
            echo "no write access to $repo: using my fork $fork" | tee -a "$d/push.log"
            ;;
          missing)
            echo "no write access to $repo and no fork yet: creating $fork" | tee -a "$d/push.log"
            gh repo fork "$repo" --clone=false
            waited=0
            until gh api "repos/$fork" --jq .full_name >/dev/null 2>&1; do
              if [ "$waited" -ge 90 ]; then
                echo "fork $fork not ready after ${waited}s" >&2
                exit 1
              fi
              sleep 3
              waited=$((waited + 3))
            done
            ;;
          *)
            # A repository with the fork's name that is not a fork of this one:
            # never push to it.
            echo "$fork exists but its parent is '$parent', not $repo: refusing to push there" >&2
            exit 1
            ;;
        esac
        push_url="https://github.com/$fork.git"
        head_ref="$login:$branch"
      fi
      echo "pushing $branch to $push_url" | tee -a "$d/push.log"
      git -C "$work" push --quiet "$push_url" "HEAD:$branch"
      # Autonomy ceiling (ADR 0040): bin/publish-gate decides, an empty input is legacy.
      if [ -n "{{.inputs.autonomy}}" ]; then
        grc=0
        ITEM_CLASS=$(cat "$d/item_class" 2>/dev/null || echo 3) \
        AUTONOMY="{{.inputs.autonomy}}" GATE_REF="$repo#$iss" GATE_ARTIFACT="$d/fix.md" GATE_REPO="$repo" \
        GATE_BRANCH="$branch" GATE_BASE="$base" GATE_CLOSES="$iss" \
          "${DOTS_HOME:-/work}/bin/publish-gate" open-pr || grc=$?
        [ "$grc" = 0 ] || { echo "autonomy: pull request not opened (gate $grc)"; exit 0; }
      fi
      printf '\n\nCloses #%s\n' "$iss" >> "$d/fix.md"
      url=$(gh pr create --repo "$repo" --head "$head_ref" --base "$(cat "$d/default_branch")" \
        --title "$title" --body-file "$d/fix.md" | tail -1)
      echo "$url" | tee "$d/pr-url"
      git -C "$work" --no-pager diff --stat "HEAD~1"
    timeout: 900
    on_success: notify
    on_failure: error

  notify:
    type: step
    command: |
      set -eu
      repo={{.inputs.repo}}
      iss={{.inputs.issue}}
      d=${STATE_DIR:-/state}/fix/$repo/issue-$iss
      rm -rf "$d.lock"
      # The pull request is pushed and the answer written: drop the checkout.
      rm -rf "$d/work"
      pr=$(cat "$d/pr-url" 2>/dev/null || true)
      echo "issue #$iss: ${pr:-no pull request}"
      # A run that declines must still say so where I read the issue: the
      # agent's answer is the whole result, and silence looks like a failure.
      if [ -z "$pr" ] && [ -s "$d/answer.md" ]; then
        # Autonomy ceiling (ADR 0040): bin/publish-gate decides, an empty input is legacy.
        grc=0
        if [ -n "{{.inputs.autonomy}}" ]; then
          ITEM_CLASS=$(cat "$d/item_class" 2>/dev/null || echo 3) \
          AUTONOMY="{{.inputs.autonomy}}" GATE_REF="$repo#$iss" GATE_ARTIFACT="$d/answer.md" GATE_REPO="$repo" \
            "${DOTS_HOME:-/work}/bin/publish-gate" comment || grc=$?
          [ "$grc" = 0 ] || echo "autonomy: answer not published (gate $grc)"
        fi
        if [ "$grc" = 0 ]; then
          gh issue comment "$iss" --repo "$repo" --body-file "$d/answer.md" \
            || echo "issue comment failed"
        fi
      fi
      if [ -n "$pr" ] && [ -n "${DISCORD_WEBHOOK:-}" ]; then
        msg="$repo issue #$iss:
      <$pr>"
        jq -n --arg c "$msg" '{content: $c}' \
          | curl -fsS -o /dev/null -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK" \
          || echo "discord notification failed"
      fi
    timeout: 60
    on_success: done
    on_failure: error

  done:
    type: terminal
    status: success

  error:
    type: terminal
    status: failure
