# Every repository the dot works on, and what it does on each. This is the one
# file to edit: awf-gh.yaml, tend.list, repos.map and sync.map are generated
# from it by `make repos`, and the dashboard regenerates them when it saves this
# file. Copy it to repos.yaml (gitignored: this repository is public, the names
# are not). `bin/repos features` lists every key a repository accepts.
version: 1

# Watcher settings. awf_url and state_path are left out on purpose:
# `make configure` writes the ones that fit local or docker mode.
settings:
  max_per_run: 6
  # With two dots on one repository (ADR 0038): this server's own id. Then a
  # repository's `dot:` names the dot that acts there, and every other server
  # leaves it out of the generated files. See docs/dots.md.
  # dot_id: workstation
  # A name for an awf serve that runs the tasks of the repositories which name
  # it with `executor:`. The watcher stays on this machine and writes one
  # awf-gh.<name>.yaml per executor (ADR 0031).
  executors:
    server: http://127.0.0.1:2512
  # ADR 0032 and 0050. `host` is the highest trust level this machine may hold: open
  # (the default), client, private or strict. A repository at client or above must stay
  # inside the allow-list below (its provider, the models it sets on a rule, the executor
  # that holds its code), in Europe at least (`region` for this machine, `regions` for each
  # executor: a value starting with eu), and use only models from a provider with zero data
  # retention (`zdr`: the prefix of a model id before "/", or anthropic for the claude CLI).
  # A private or strict repository uses only a provider the owner hosts (`self_hosted`).
  trust:
    host: client
    region: eu
    regions: {server: eu}
    zdr: [mistral]
    allow:
      providers: [opencode]
      models: [mistral/mistral-small-latest]
      executors: [server]

# Values every enabled feature inherits. A default never switches a feature on:
# `review:` below only gives the repositories that enable review their
# ignore_authors. A plain value (provider) applies to every repository.
defaults:
  review:
    ignore_authors: ["dependabot[bot]", "renovate[bot]", "github-actions[bot]"]
  reply:
    only_authors: ["your-login"]
  fix_issue:
    ignore_authors: ["dependabot[bot]", "renovate[bot]", "github-actions[bot]"]
  # provider: opencode          # opencode (default) or claude, for every repository
  # autonomy: act               # ceiling, ADR 0040: observe, propose (held until released by publish-held), act (default) or auto; auto refused under trust client/strict

# A named bundle of keys. A repository lists the ones it wants under `use`.
profiles:
  managed:
    tend: {auto_merge: true}
    review: true
    fix_issue: true

  # ADR 0035: a dot is one engine under one policy profile. These two profiles
  # run the same workflows and differ only by policy. `personal` owns the code of
  # a repository the owner maintains: it may merge its own pull requests, and the
  # circuit breaker drops it back to `act` after a revert or a red default branch.
  # `company` runs on code that belongs to someone else: it never merges, it marks
  # its work, it stays inside a daily spend cap, and a repository using it must
  # still name an allowed executor (trust: client).
  personal:
    autonomy: auto
    circuit_breaker: true
    tend: {auto_merge: true}
    review: true
    fix_issue: true
  company:
    trust: client
    autonomy: act
    identity: marker
    # A client repository's pushes go through the patch guard; an empty block takes the defaults.
    # Add a throwaway-container test with: test: {image: dots-test, command: make test}.
    sandbox: {}
    budget: {daily_usd: 20}
    review: true

repos:
  # The same engine under two profiles (ADR 0035).
  your-org/personal-tool:
    use: [personal]
  company-org/service:
    use: [company]
    executor: server
  # A repository the dot maintains end to end: review each pull request, turn
  # every new issue into a pull request, tend it daily and keep a clone in sync.
  your-org/your-repo:
    use: [managed]
    checkout: /home/you/projects/your-repo   # workflows reuse it instead of cloning
    sync: true                               # bin/sync fast-forwards that checkout

  # Another repository, reviewed by Claude Code instead of opencode (set
  # DOT_CLAUDE with `make configure` first). A false switches a profile key off.
  your-org/claude-routed:
    use: [managed]
    provider: claude
    fix_issue: false

  # Upstream, where I am not a maintainer: answer the maintainers on my own pull
  # requests and fix my red checks. No review: I do not post as a reviewer there.
  upstream-org/upstream-repo:
    reply: true
    fix_ci:
      only_authors: ["your-login"]

  # Another party's code (ADR 0032). Uncomment settings.executors and
  # settings.trust above first. The generator then refuses a block that breaks
  # the level: the executor has to be listed, the provider and the models it
  # sets have to be listed, and auto_merge is refused. `strict` also refuses a
  # local checkout and needs settings.trust.host: strict. identity must be marker
  # or signed there: the dot marks its work on another party's repository.
  client-org/client-repo:
    trust: client
    executor: server
    identity: marker
    sandbox: {max_lines: 300, allow_paths: ["src/*", "tests/*"]}
    review: true

  # One feature several times: the review runs on pull requests, and `/dots take`
  # from me only runs it on demand. A list holds one block per rule.
  your-org/delegated:
    review:
      - true
      - {on: [command], only_authors: ["your-login"], ignore_authors: []}
    # Only the issues that carry a label:
    fix_issue: {label: dot}

  # Watched here, run elsewhere: the tasks go to the awf serve named in
  # settings.executors. tend still runs on the watching machine.
  # your-org/run-on-my-workstation:
  #   review: true
  #   executor: workstation

  # Two dots, one repository: only the dot named here acts. A server whose
  # settings.dot_id differs generates no rule, tend line, checkout or sync line
  # for it. Needs settings.dot_id. To move it, change the key on both servers.
  # your-org/shared-with-a-colleague:
  #   dot: colleague
  #   review: true
