# Polled by dots-awf-gh.timer. One pass, then exit.
#
# Copy to awf-gh.yaml and edit. awf-gh.yaml is gitignored: it names the private
# repos you watch, and this repository is public.
awf_url: http://awf:2511
state_path: /state/awf-gh/seen.jsonl
max_per_run: 6

repos:
  - repo: awf-project/cli
    scope: local
    workflow: review-pr
    on: [pr-opened, pr-updated, checks-failed]
    ignore_authors: ["dependabot[bot]", "renovate[bot]", "github-actions[bot]"]

  # review-pr's `provider` input defaults to opencode. Route a repository
  # whose work leans on Claude Code instead (set DOT_CLAUDE in bin/configure
  # first) by overriding it here. The models then come from the claude presets
  # (claude_review_model, claude_address_model), not the opencode ones. Needs an
  # awf-gh build that carries the repos[].inputs field (not yet in an
  # awf-project/awf-gh release at the time of writing, see AWF_GH_SRC in the
  # Makefile).
  - repo: your-org/claude-routed-repo
    scope: local
    workflow: review-pr
    on: [pr-opened, pr-updated, checks-failed]
    ignore_authors: ["dependabot[bot]", "renovate[bot]", "github-actions[bot]"]
    inputs:
      provider: claude

  # Answer review comments on your own PRs. only_authors keeps other people's
  # PRs out; review-comment fires once per new comment.
  - repo: your-org/your-repo
    scope: local
    workflow: reply-pr
    on: [review-comment]
    only_authors: ["your-login"]

  # Turn a labeled issue into a pull request. The label is the trigger, so no
  # issue is touched until you add it; awf-gh fires once per issue and label.
  - repo: your-org/your-repo
    scope: local
    workflow: fix-issue
    on: [issue-labeled]
    labels: ["dot"]
    ignore_authors: ["dependabot[bot]", "renovate[bot]", "github-actions[bot]"]

  # Turn a red check on your own pull request into one pushed commit. The
  # dedup key is the head commit, and it has no workflow in it: a repository
  # cannot watch checks-failed with review-pr and fix-ci at once.
  - repo: your-org/your-repo
    scope: local
    workflow: fix-ci
    on: [checks-failed]
    only_authors: ["your-login"]
