<!doctype html>
<html lang="en" data-theme="dark" data-theme-mode="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>dots</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script>
  // Theme before first paint: no flash when the page opens in light mode.
  (() => {
    var mode = localStorage.getItem("dots-theme") || "auto";
    var dark = mode === "dark" || (mode === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    var el = document.documentElement;
    el.dataset.themeMode = mode;
    el.dataset.theme = dark ? "dark" : "light";
  })();
</script>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a class="skip" href="#main" data-i18n="index.skip">Skip to content</a>

<header class="top">
  <a class="brand" href="#activity" aria-label="dots, activity">
    <span class="logo" aria-hidden="true"></span>
    <span>dots</span>
  </a>

  <nav class="tabs" id="tabs" aria-label="Sections" data-i18n-attr="aria-label:index.sections">
    <a href="#home" data-view="home" data-i18n="nav.home">Home</a>
    <a href="#activity" data-view="activity" data-i18n="nav.activity">Activity</a>
    <a href="#autonomy" data-view="autonomy" data-i18n="nav.autonomy">Autonomy</a>
    <a href="#links" data-view="links" data-i18n="nav.links">Links</a>
    <span class="sep" aria-hidden="true"></span>
    <a href="#workflows" data-view="workflows" data-i18n="nav.workflows">Workflows</a>
    <a href="#repos" data-view="repos" data-i18n="nav.repos">Repos</a>
    <a href="#config" data-view="config" data-i18n="nav.config">Settings</a>
    <span class="sep" aria-hidden="true"></span>
    <a href="#costs" data-view="costs" data-i18n="nav.costs">Cost</a>
    <a href="#health" data-view="health" data-i18n="nav.health">Health</a>
    <a href="#memory" data-view="memory" data-i18n="nav.memory">Memory</a>
    <a href="#audit" data-view="audit" data-i18n="nav.audit">Audit</a>
  </nav>

  <div class="tools">
    <span id="whoami" class="whoami" hidden></span>
    <span id="awf-status" class="pill" role="status" aria-live="polite">
      <i class="dot" aria-hidden="true"></i><span data-i18n="index.checking">checking</span>
    </span>
    <button class="btn ghost sm" id="palette-btn" type="button" title="Go to… (Ctrl+K)" data-i18n-attr="title:index.go_to">
      <span data-i18n="index.search">Search</span> <kbd>Ctrl K</kbd>
    </button>
  </div>
</header>

<div id="banner" class="banner" hidden></div>

<main id="main">
  <section id="view" aria-live="polite"></section>
</main>

<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
<div id="modal-root"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
