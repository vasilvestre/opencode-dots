<!doctype html>
<html lang="en" data-theme="dark" data-theme-mode="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>dots</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script>
  // Theme before first paint: no flash when the page opens in light mode.
  (() => {
    var mode = localStorage.getItem("dots-theme") || "auto";
    var dark = mode === "dark" || (mode === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    var el = document.documentElement;
    el.dataset.themeMode = mode;
    el.dataset.theme = dark ? "dark" : "light";
  })();
</script>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="top">
  <a class="brand" href="#activity" aria-label="dots, activity">
    <span class="logo" aria-hidden="true"></span>
    <span>dots</span>
  </a>

  <nav class="tabs" id="tabs" aria-label="Sections">
    <a href="#activity" data-view="activity">Activity</a>
    <a href="#workflows" data-view="workflows">Workflows</a>
    <a href="#config" data-view="config">Config</a>
    <a href="#repos" data-view="repos">Repos</a>
    <a href="#memory" data-view="memory">Memory</a>
  </nav>

  <div class="tools">
    <span id="awf-status" class="pill" role="status" aria-live="polite">
      <i class="dot" aria-hidden="true"></i><span>checking</span>
    </span>
    <a class="icon-btn" href="http://127.0.0.1:4096" target="_blank" rel="noreferrer"
       title="Open the opencode server">opencode</a>
    <label class="theme">
      <span class="sr-only">Theme</span>
      <select id="theme">
        <option value="auto">Auto</option>
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </label>
  </div>
</header>

<div id="banner" class="banner" hidden></div>

<main id="main">
  <section id="view" aria-live="polite"></section>
</main>

<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
<div id="modal-root"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
