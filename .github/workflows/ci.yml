name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: bin/adr check
      - run: bin/check-binaries tracked
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1
      - run: test/binaries.sh
      - run: test/backup.sh
      - run: test/shim.sh
      - run: test/workspace.sh
      - run: test/watchers.sh
      - run: test/held.sh
      - run: test/tend.sh
      - run: test/propose-links.sh
      - run: make script-tests
      - run: deploy/test/offline.sh
      # Unpinned on purpose: take the new lints of each release as they ship.
      - run: go install github.com/vasilvestre/deslop-please-go/cmd/deslop-please@latest
      - run: deslop-please ./...
