# Nothing listens on a public interface: every port stays on loopback and the
# containers talk over the compose network.
#
# gh keeps its token in the host keyring, which a container cannot read, so
# every service gets GH_TOKEN from .env instead. Run `gh auth token` to get it.
services:
  # Started only when bin/configure picks opencode=docker (COMPOSE_PROFILES).
  opencode:
    profiles: ["opencode-docker"]
    build:
      context: .
      args:
        WITH_TOWER: "0"
    image: opencode-dots:latest
    command: ["opencode", "serve", "--hostname", "0.0.0.0", "--port", "4096"]
    ports:
      - "127.0.0.1:4096:4096"
    volumes:
      # The bot's brain lives in this repo, not in ~/.config/opencode.
      - ./agent:/home/agent/.config/opencode
      - ${HOME}/projects:/workspace
      # Provider credentials. Read-write because tokens refresh.
      - ${HOME}/.local/share/opencode:/home/agent/.local/share/opencode
    environment:
      GH_TOKEN: ${GH_TOKEN:-}
    restart: unless-stopped

  # Started only when bin/configure picks awf=docker (COMPOSE_PROFILES).
  awf:
    profiles: ["awf-docker"]
    image: opencode-dots:latest
    # opencode v2 refuses to run from the home directory ("Location not found").
    working_dir: /workspace
    command: ["awf", "serve", "--host", "0.0.0.0", "--port", "2511", "--storage", "/state/awf"]
    ports:
      - "127.0.0.1:2511:2511"
    volumes:
      - ./agent:/home/agent/.config/opencode
      - .:/work:ro
      - ./workflows:/home/agent/.config/awf/workflows:ro
      - ${HOME}/projects:/workspace
      # Workflows look a repository up in repos.map by absolute host path, so
      # that same path has to resolve inside the container.
      - ${HOME}/projects:${HOME}/projects
      # Bind mount, not a named volume: named volumes arrive root-owned and the
      # agent user cannot write them.
      - ./state:/state
    environment:
      GH_TOKEN: ${GH_TOKEN:-}
      DISCORD_WEBHOOK: ${DISCORD_WEBHOOK:-}
      # Workflows read this instead of a hardcoded /state: a local opencode
      # server only sees host paths.
      STATE_DIR: /state
      # reply-pr runaway-loop cap. The agent decides when to stop; this only
      # catches an absurd number of pushed rounds.
      MAX_REPLY_ROUNDS: ${MAX_REPLY_ROUNDS:-10}
      # Keep WORK_ROOT under STATE_DIR unless you also mount it: a local
      # opencode server only reads host paths.
      WORK_ROOT: ${WORK_ROOT:-}
    restart: unless-stopped

  # One-shot: driven by dots-awf-gh.timer, never left running.
  awf-gh:
    image: opencode-dots:latest
    command: ["awf-gh", "--config", "/work/awf-gh.yaml"]
    volumes:
      - .:/work:ro
      - ./state:/state
    environment:
      GH_TOKEN: ${GH_TOKEN:-}
    profiles: ["jobs"]
